# 工作流名称
name: Welcome
# 工作流运行时显示名称
run-name: 欢迎新的贡献者

# 怎样触发工作流
on:
  # 与 labeler.yml 同理：fork 来的 PR 在 pull_request 事件下拿不到可写的 token，
  # 而我们要在 PR 上发评论，所以用 pull_request_target。
  #
  # 安全前提：本工作流**不 checkout、不执行**任何 PR 内容。
  # 它只调用 actions/first-interaction（SHA 锁定）判断「这是不是该作者的第一个
  # Issue / PR」，然后贴一段固定的文本。评论正文里不含任何来自 PR 的插值，
  # 因此 PR 作者无法通过改标题、改描述来改变这里执行的东西。
  #
  # 若未来有任何一个工作流要 checkout PR 的 head 分支，必须改用 pull_request
  # + 显式授权，而不是在这里加豁免。
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

# 最小权限：只发评论，别的都不需要
permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: 向首次贡献者致意
    runs-on: ubuntu-latest
    steps:
      - name: 发表欢迎评论
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          # 注意：v3 起输入名改成了 snake_case，旧版的 repo-token 已不再被识别
          repo_token: ${{ secrets.GITHUB_TOKEN }}

          issue_message: |
            欢迎，这是你在这个仓库的第一个 Issue！

            感谢你花时间把它写下来。维护者收到通知后会尽快查看。

            为了让问题更快被定位，方便的话可以补充：
            - 你用的是哪个技能（`custom/` 里的自建技能，还是 `.agents/` 里的上游技能）
            - 期望的结果与实际看到的结果
            - 如果有报错信息，直接贴出来就好

            仓库的结构、以及两类技能的区别见
            [README](https://github.com/nicholyx/ai-skills/blob/main/README.md)。

            如果一周内没有收到回复，欢迎直接在这里 @ 维护者，通常是我们漏看了通知。

          pr_message: |
            感谢你的第一个 Pull Request！

            我已经收到通知，会尽快开始 review。在你等待的时候，有几件事可以顺手确认一下：

            - [ ] 本地跑过 `./scripts/lint.sh`
            - [ ] 提交信息遵循了[约定式提交规范](https://www.conventionalcommits.org/zh-hans/)
            - [ ] PR 描述里说明了**为什么**要做这个改动

            如果改的是技能内容，另外值得一提的是：

            - `custom/` 是自建技能，直接改就好
            - `.agents/` 是 `npx skills add` 装来的上游内容，在这里改了下次
              `npx skills update` 会被覆盖掉 —— 这类问题更适合回到上游提，
              或者在本仓库调整 `skills-lock.json` 里的版本。README 里有两者的对照表

            CI 会自动跑起来（大约 1 分钟）。如果红了不用慌，点击失败的检查项就能看到
            具体原因；实在看不懂就把日志贴到评论里，我们一起看。

            首次贡献总是最需要勇气的，谢谢你迈出这一步。
